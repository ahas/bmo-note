# Generated from bmo-app.toml by bmo-app-sdk's bmo-app-declare.
# Change the manifest and run `bmo-app-declare bmo-app.toml` again; do not hand-edit this file.

# What installing this application needs on a machine, read by the testbed's install verb.
install = 1

restart = "systemctl --user restart bmo-note.service"

[[needs]]
program = "cargo"
what = "Builds the service; the Rust toolchain from https://rustup.rs."

[[needs]]
program = "bun"
what = "Builds the console bundle at every release; the Bun runtime from https://bun.sh."

[[port]]
name = "note.server"
number = 13129

[[token]]
name = "note.service"
file = "env/note-service.token"

[[token]]
name = "note.console"
file = "env/note-console.token"

# The deployed settings the release links beside its own.
[[settings]]
file = "env/note.toml"
text = """
[server]
listen = "127.0.0.1:{{port.note.server}}"
token = "{{token.note.service}}"
data_root = "{{data_root}}"

[console]
token = "{{token.note.console}}"

[store]
path = "{{data_root}}/note/note.db"
"""

[[line]]
file = "env/web-console.env"
key = "NOTE_ADDRESS"
value = "http://127.0.0.1:{{port.note.server}}"

[[line]]
file = "env/web-console.env"
key = "NOTE_TOKEN"
value = "{{token.note.console}}"
