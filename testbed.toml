# Generated from bmo-app.toml by bmo-app-sdk's bmo-app-declare.
# Change the manifest and run `bmo-app-declare bmo-app.toml` again; do not hand-edit this file.

testbed = 0
name = "bmo-note"

# The shared base whose generator and skeletons this repository stands on.
upstreams = ["bmo-app-sdk"]

[test]
languages = ["cargo", "bun"]
# What a fresh tree lacks, laid before any unit runs.
setup = ["cd client && bun scripts/install.ts"]

[projects]
# The console bundle is a project of its own, its manifest and lockfile outside any package workspace.
paths = ["client"]

[check]
# The sweeps that read the tree before anything runs.
quick = ["layout", "dependencies", "cargo-profile", "shared-versions"]
# The base library the service crate takes by a path beside this checkout.
base_libraries = ["bmo-app-service", "bmo-console-face"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[build]
binaries = ["bmo-note"]

# The service's deploy tree and its data, kept apart from every release.
[deploy]
root = "~/.local/share/bmo-note"
link = "deploy"
data_root = "~/.local/share/bmo/data"
# The deployed settings each release links beside its own.
env_links = [{ link = "settings.local.toml", target = "env/note.toml" }]
units = ["deploy/*.service"]
health = "~/.local/share/bmo-note/deploy/bin/bmo-note health"

# The screen the service brings to a console, whose face the deployment probes once
# the service is up.
[deploy.console]
reach = "bin/bmo-note console-reach"

# The console bundle the service serves from the release: its locked packages laid
# and its folder built inside the release, where the settings' console folder reads it.
[[deploy.step]]
id = "console-bundle"
phase = "before-flip"
command = '''
set -eu
cd client
bun scripts/install.ts
bun run bundle
'''

# The app the console screen is, published on the delegation chain once the service
# answers ready, from the declaration the release carries.
[[deploy.step]]
id = "publish-app"
phase = "after-health"
command = '''
set -eu
bmo pocket app deploy/app.toml
'''
