# The workspace: the note service's own package at the root, which also holds the checks that span the
# repository in `tests/`. The console bundle under `client/` is a project of its own. The fork's Rust
# folders stand excluded: they are Enterprise-licensed paths this unit never builds (docs/affine.md).
[workspace]
members = []
exclude = [
  "packages/backend/native",
  "packages/common/native",
  "packages/frontend/mobile-native",
  "packages/frontend/native",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-ini = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-note"
description = "The note service: editable TipTap notes with links and comments, shown in the console."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
test = false

[[bin]]
name = "bmo-note"
path = "src/main.rs"
test = false

[dependencies]
# The routes the service answers on.
axum.workspace = true
# The list cursors and the share tokens, base64url.
base64.workspace = true
# The console face: the manifest, the bundle's files and their guard, by bmo-ui's console plugin contract.
bmo-console-face = { path = "../../base/chat/console-face" }
# The binary's command line.
clap.workspace = true
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config.workspace = true
# The event stream, read as it comes.
futures-util.workspace = true
# The health verb's call to the service.
reqwest.workspace = true
# The notes, one SQLite file.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The deployment's settings file.
toml.workspace = true

[dev-dependencies]
# The names the routes refuse and the checks match.
regex.workspace = true
# The service's unit file, read in its INI shape by the repository's checks.
rust-ini.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
